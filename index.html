<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social link</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="card">
                <div class="card-top">
                    <img src="./img/avatar-jessica.jpeg" alt="card photo" class="user-photo">
                    <h1 class="user-name">Jessica Randall</h1>
                    <a href="" class="user-location">London, United Kingdom</a>
                    <p class="user-text">"Front-end developer and avid reader"</p>
                </div>
                <div class="card-navigation"></div>
            </div>
        </div>
    </div>
</body>
</html>
